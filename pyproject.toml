[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofworker"
version = "0.1.0"
description = "Independent evidence-first verification for AI-generated work"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
proofworker = "proofworker.cli:main"

[tool.setuptools.packages.find]
include = ["proofworker*"]
