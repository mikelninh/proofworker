name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/harness_check.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_golden.py
      - run: python -m py_compile scripts/dealwork_connect.py
      - run: python scripts/dealwork_connect.py --help
      - run: python -m py_compile scripts/revenue_operator.py
      - run: python scripts/revenue_operator.py self-test
      - run: python scripts/revenue_operator.py --help
      - run: python -m py_compile scripts/revenue_operator_live.py
      - run: python scripts/revenue_operator_live.py self-test
      - run: python scripts/revenue_operator_live.py --help
      - run: python -m py_compile scripts/revenue_operator_live_v2.py
      - run: python scripts/revenue_operator_live_v2.py self-test
      - run: python scripts/revenue_operator_live_v2.py --help
      - run: python -m py_compile scripts/revenue_operator_live_v3.py
      - run: python scripts/revenue_operator_live_v3.py self-test
      - run: python scripts/revenue_operator_live_v3.py --help
